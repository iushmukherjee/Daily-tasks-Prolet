<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prolet - Daily Task Restorer | IANCON</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .brand-blue { color: #1d52a2; }
    .bg-brand-blue { background-color: #1d52a2; }
    .border-brand-blue { border-color: #1d52a2; }
    .brand-red { color: #e53238; }
    .bg-brand-red { background-color: #e53238; }
    .border-brand-red { border-color: #e53238; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-3 select-none font-sans">

  <!-- Header Banner -->
  <header class="w-full max-w-xl flex justify-between items-center bg-slate-900/90 border border-slate-800 p-3 rounded-2xl shadow-xl">
    <div class="flex items-center gap-3">
      <img src="logo.png" alt="Prolet Logo" class="h-9 object-contain" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\"text-2xl font-black brand-blue\">Pr<span class=\"brand-red\">O</span>let</span>';">
      <div>
        <h1 class="text-xs font-bold text-slate-200">Daily Task Restorer</h1>
        <p class="text-[10px] text-slate-400">Essential Tremor Motor Precision Assessment</p>
      </div>
    </div>
    <span class="text-[10px] bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full font-mono text-cyan-400">IANCON</span>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-2xl my-2 flex flex-col gap-3">
    
    <!-- Task Selection Tabs -->
    <div class="grid grid-cols-3 gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800/80">
      <button id="btnTask1" onclick="switchTask('tea')" class="py-2 text-xs font-bold rounded-lg transition bg-brand-blue text-white shadow">
        1. Pour Tea
      </button>
      <button id="btnTask2" onclick="switchTask('spiral')" class="py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white">
        2. Spiral
      </button>
      <button id="btnTask3" onclick="switchTask('button')" class="py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white">
        3. Thread Buttons
      </button>
    </div>

    <!-- Live Status & Score Bar -->
    <div class="flex justify-between items-center bg-slate-950 px-3 py-2 rounded-xl border border-slate-800 text-xs">
      <div>
        <span class="text-slate-400 text-[10px] block">Therapeutic State</span>
        <span id="statusBadge" class="font-extrabold brand-red uppercase text-xs">Untreated ET Tremor</span>
      </div>
      <div class="text-right">
        <span class="text-slate-400 text-[10px] block">Task Precision Score</span>
        <span id="scoreDisplay" class="text-lg font-black text-white">0%</span>
      </div>
    </div>

    <!-- Dynamic Interactive Canvas Area -->
    <div class="relative w-full aspect-square bg-slate-950 rounded-xl border-2 border-slate-800 overflow-hidden touch-none cursor-crosshair">
      <canvas id="gameCanvas" class="w-full h-full block"></canvas>
      
      <!-- Instructional Banner -->
      <div id="instructionBox" class="absolute top-2 left-2 right-2 bg-slate-900/90 border border-slate-700 p-2 rounded-lg text-center text-xs text-slate-300 pointer-events-none">
        Press & Hold to pour tea into the moving cup.
      </div>
    </div>

    <!-- Treatment Toggle Button -->
    <button id="proletBtn" onclick="toggleProlet()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold py-3.5 rounded-xl transition transform active:scale-95 shadow-lg flex items-center justify-center gap-2 text-sm">
      <span>⚡ ACTIVATE PROLET (Primidone) EFFICACY</span>
    </button>
  </main>

  <!-- Live Waveform Footer -->
  <footer class="w-full max-w-xl bg-slate-900/90 border border-slate-800 rounded-xl p-3 shadow-lg">
    <div class="flex justify-between items-center mb-1 text-[10px] text-slate-400">
      <span>Thalamocortical Motor Waveform</span>
      <span id="waveformLabel" class="brand-red font-bold">Unstabilized Oscillation</span>
    </div>
    <div class="h-10 w-full bg-slate-950 rounded-lg overflow-hidden border border-slate-800">
      <canvas id="waveCanvas" class="w-full h-full block"></canvas>
    </div>
  </footer>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const waveCanvas = document.getElementById('waveCanvas');
    const waveCtx = waveCanvas.getContext('2d');

    let currentTask = 'tea';
    let isProletActive = false;
    let isInteracting = false;
    let score = 0;

    let pointer = { x: 150, y: 150 };
    let target = { x: 150, y: 150, radius: 40, angle: 0 };
    
    // Task 1 Stats
    let teaAttempts = 0;
    let teaHits = 0;

    // Task 2 Stats
    let spiralPath = [];
    let userPath = [];

    // Task 3 Stats (Precision Needle Threading)
    let buttonHoles = [];
    let activeHoleIdx = 0;
    let buttonPath = [];
    let threadHits = 0;
    let threadErrors = 0;

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      waveCanvas.width = waveCanvas.parentElement.clientWidth;
      waveCanvas.height = waveCanvas.parentElement.clientHeight;
      initTask();
    }

    // Web Audio Sound Synth
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, duration = 0.1, type = 'sine') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function initTask() {
      score = 0;
      teaAttempts = 0;
      teaHits = 0;
      userPath = [];
      buttonPath = [];
      activeHoleIdx = 0;
      threadHits = 0;
      threadErrors = 0;
      document.getElementById('scoreDisplay').innerText = '0%';

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      if (currentTask === 'tea') {
        target = { x: cx, y: cy + 60, radius: 42, angle: 0 };
        document.getElementById('instructionBox').innerText = 'Press & Hold to pour liquid into the moving cup.';
      } 
      else if (currentTask === 'spiral') {
        spiralPath = [];
        const maxRadius = Math.min(canvas.width, canvas.height) * 0.38;
        for (let i = 0; i < 220; i++) {
          let angle = 0.12 * i;
          let r = (maxRadius / 220) * i;
          spiralPath.push({ x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) });
        }
        document.getElementById('instructionBox').innerText = 'Trace finger/stylus along the spiral baseline path.';
      } 
      else if (currentTask === 'button') {
        buttonHoles = [
          { x: cx, y: cy - 100, radius: 22, passed: false },
          { x: cx, y: cy, radius: 22, passed: false },
          { x: cx, y: cy + 100, radius: 22, passed: false }
        ];
        document.getElementById('instructionBox').innerText = 'Press & drag the thread through all 3 button holes in sequence without hitting the rims.';
      }
    }

    function switchTask(task) {
      currentTask = task;
      ['btnTask1', 'btnTask2', 'btnTask3'].forEach(id => {
        document.getElementById(id).className = 'py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white';
      });

      if(task === 'tea') document.getElementById('btnTask1').className = 'py-2 text-xs font-bold rounded-lg transition bg-brand-blue text-white shadow';
      if(task === 'spiral') document.getElementById('btnTask2').className = 'py-2 text-xs font-bold rounded-lg transition bg-brand-blue text-white shadow';
      if(task === 'button') document.getElementById('btnTask3').className = 'py-2 text-xs font-bold rounded-lg transition bg-brand-blue text-white shadow';

      initTask();
    }

    function toggleProlet() {
      isProletActive = !isProletActive;
      const badge = document.getElementById('statusBadge');
      const label = document.getElementById('waveformLabel');
      const btn = document.getElementById('proletBtn');

      if (isProletActive) {
        badge.innerText = 'PROLET ACTIVE (Therapeutic Baseline)';
        badge.className = 'font-extrabold text-emerald-400 uppercase text-xs';
        label.innerText = 'Smooth Thalamic Signal (Prolet)';
        label.className = 'text-emerald-400 font-bold';
        btn.innerHTML = '<span>RESET TO UNTREATED ET STATE</span>';
        btn.className = 'w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-extrabold py-3.5 rounded-xl transition border border-slate-700 text-sm';
        playTone(650, 0.2, 'triangle');
      } else {
        badge.innerText = 'Untreated ET Tremor';
        badge.className = 'font-extrabold brand-red uppercase text-xs';
        label.innerText = 'Unstabilized Oscillation';
        label.className = 'brand-red font-bold';
        btn.innerHTML = '<span>⚡ ACTIVATE PROLET (Primidone) EFFICACY</span>';
        btn.className = 'w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold py-3.5 rounded-xl transition transform active:scale-95 shadow-lg text-sm';
        playTone(220, 0.2, 'sawtooth');
      }
      initTask();
    }

    function updatePointer(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      let rawX = clientX - rect.left;
      let rawY = clientY - rect.top;

      // Tremor Jitter Calculation
      if (!isProletActive && isInteracting) {
        let jitterX = (Math.random() - 0.5) * 36;
        let jitterY = (Math.random() - 0.5) * 36;
        pointer.x = rawX + jitterX;
        pointer.y = rawY + jitterY;
      } else {
        pointer.x = rawX;
        pointer.y = rawY;
      }

      if (isInteracting) {
        if (currentTask === 'spiral') {
          userPath.push({ x: pointer.x, y: pointer.y });
          calculateSpiralScore();
        } else if (currentTask === 'button') {
          buttonPath.push({ x: pointer.x, y: pointer.y });
          calculateThreadingScore();
        }
      }
    }

    function startInteract(e) {
      isInteracting = true;
      updatePointer(e);
    }

    function stopInteract() {
      isInteracting = false;
    }

    canvas.addEventListener('mousedown', startInteract);
    canvas.addEventListener('mousemove', (e) => { if (isInteracting) updatePointer(e); });
    canvas.addEventListener('mouseup', stopInteract);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startInteract(e); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (isInteracting) updatePointer(e); });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); stopInteract(); });

    // Stricter Spiral Math for ET vs Prolet
    function calculateSpiralScore() {
      if (userPath.length < 5 || spiralPath.length === 0) return;
      
      let totalErr = 0;
      userPath.forEach(pt => {
        let minDist = Infinity;
        spiralPath.forEach(s => {
          let d = Math.hypot(pt.x - s.x, pt.y - s.y);
          if (d < minDist) minDist = d;
        });
        totalErr += minDist;
      });

      let avgErr = totalErr / userPath.length;

      // Stricter Penalty Curve
      if (!isProletActive) {
        // High penalty for Tremor Jitter
        score = Math.max(12, Math.min(48, Math.round(100 - (avgErr * 6.5))));
      } else {
        // High accuracy rewarded for Smooth Stroke
        score = Math.max(70, Math.min(98, Math.round(100 - (avgErr * 2.0))));
      }

      document.getElementById('scoreDisplay').innerText = score + '%';
    }

    // Button Threading Logic
    function calculateThreadingScore() {
      if (activeHoleIdx >= buttonHoles.length) return;

      let targetHole = buttonHoles[activeHoleIdx];
      let dist = Math.hypot(pointer.x - targetHole.x, pointer.y - targetHole.y);

      if (dist <= targetHole.radius) {
        threadHits++;
        if (dist <= targetHole.radius * 0.6) {
          targetHole.passed = true;
          activeHoleIdx++;
          playTone(850, 0.15, 'triangle');
        }
      } else {
        threadErrors++;
        if (threadErrors % 6 === 0) playTone(180, 0.08, 'sawtooth');
      }

      let totalSteps = Math.max(1, threadHits + threadErrors);
      score = Math.min(100, Math.round((threadHits / totalSteps) * 100));
      if (!isProletActive) score = Math.min(score, 35); // Cap untreated score
      document.getElementById('scoreDisplay').innerText = score + '%';
    }

    // Game Loop & Canvas Renderer
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Task 1: Pour Tea
      if (currentTask === 'tea') {
        target.angle += 0.02;
        target.x = (canvas.width / 2) + Math.sin(target.angle) * 80;

        ctx.beginPath();
        ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#1e293b';
        ctx.fill();
        ctx.strokeStyle = '#1d52a2';
        ctx.lineWidth = 4;
        ctx.stroke();

        if (isInteracting) {
          teaAttempts++;
          ctx.beginPath();
          ctx.moveTo(pointer.x, 0);
          ctx.lineTo(pointer.x, canvas.height);
          ctx.strokeStyle = isProletActive ? '#22d3ee' : '#e53238';
          ctx.lineWidth = isProletActive ? 6 : 14;
          ctx.stroke();

          let dist = Math.abs(pointer.x - target.x);
          if (dist < target.radius) {
            teaHits++;
            if (teaAttempts % 4 === 0) playTone(450, 0.05);
          }
          
          let rawRatio = (teaHits / Math.max(1, teaAttempts));
          score = isProletActive ? Math.min(96, Math.round(rawRatio * 100)) : Math.min(38, Math.round(rawRatio * 50));
          document.getElementById('scoreDisplay').innerText = score + '%';
        }
      }

      // Task 2: Spiral
      else if (currentTask === 'spiral') {
        ctx.beginPath();
        spiralPath.forEach((pt, i) => {
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 14;
        ctx.stroke();

        if (userPath.length > 1) {
          ctx.beginPath();
          userPath.forEach((pt, i) => {
            if (i === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          });
          ctx.strokeStyle = isProletActive ? '#22d3ee' : '#e53238';
          ctx.lineWidth = 4;
          ctx.stroke();
        }
      }

      // Task 3: Threading Shirt Buttons
      else if (currentTask === 'button') {
        // Draw Shirt Placket Line
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 40);
        ctx.lineTo(canvas.width / 2, canvas.height - 40);
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 6;
        ctx.stroke();

        // Draw Buttons
        buttonHoles.forEach((hole, idx) => {
          ctx.beginPath();
          ctx.arc(hole.x, hole.y, hole.radius, 0, Math.PI * 2);
          ctx.fillStyle = hole.passed ? '#10b981' : (idx === activeHoleIdx ? '#1e293b' : '#0f172a');
          ctx.fill();
          ctx.strokeStyle = hole.passed ? '#34d399' : (idx === activeHoleIdx ? '#e53238' : '#475569');
          ctx.lineWidth = idx === activeHoleIdx ? 4 : 2;
          ctx.stroke();

          // Button Center Hole
          ctx.beginPath();
          ctx.arc(hole.x, hole.y, hole.radius * 0.4, 0, Math.PI * 2);
          ctx.fillStyle = '#020617';
          ctx.fill();
        });

        // Draw Thread Stroke
        if (buttonPath.length > 1) {
          ctx.beginPath();
          buttonPath.forEach((pt, i) => {
            if (i === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          });
          ctx.strokeStyle = isProletActive ? '#22d3ee' : '#e53238';
          ctx.lineWidth = 3;
          ctx.stroke();
        }
      }

      // Draw Cursor Pointer Thread
      ctx.beginPath();
      ctx.arc(pointer.x, pointer.y, 7, 0, Math.PI * 2);
      ctx.fillStyle = isProletActive ? '#10b981' : '#e53238';
      ctx.fill();

      renderOscillogram();
      requestAnimationFrame(render);
    }

    // Oscillogram Waveform Renderer
    let waveOffset = 0;
    function renderOscillogram() {
      waveCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
      waveCtx.beginPath();
      waveCtx.strokeStyle = isProletActive ? '#10b981' : '#e53238';
      waveCtx.lineWidth = 2;

      waveOffset += 0.15;
      const cy = waveCanvas.height / 2;

      for (let x = 0; x < waveCanvas.width; x++) {
        let amp = isProletActive ? 3 : 14;
        let freq = isProletActive ? 0.05 : 0.25;
        let y = cy + Math.sin(x * freq + waveOffset) * amp;
        if (!isProletActive) y += (Math.random() - 0.5) * 6;

        if (x === 0) waveCtx.moveTo(x, y);
        else waveCtx.lineTo(x, y);
      }
      waveCtx.stroke();
    }

    window.addEventListener('resize', resizeCanvas);
    window.onload = () => {
      resizeCanvas();
      render();
    };
  </script>
</body>
</html>
